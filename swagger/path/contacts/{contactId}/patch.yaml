tags:
  - Contacts
summary: 'Оновити контакт'
operationId: updateContact
description: 'Цей ендпоінт дозволяє оновити інформацію про контакт.'
parameters:
  - name: contactId
    in: path
    description: 'ID контакту, який потрібно оновити'
    required: true
    schema:
      type: string
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
          email:
            type: string
responses:
  200:
    description: 'Контакт успішно оновлений'
  404:
    description: 'Контакт не знайдений'
