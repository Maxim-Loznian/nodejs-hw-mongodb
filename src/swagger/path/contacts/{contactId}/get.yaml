tags:
  - Contacts
summary: 'Отримати контакт за ID'
operationId: getContactById
description: 'Цей ендпоінт дозволяє отримати деталі контакту за заданим ID.'
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    description: 'ID контакту, який потрібно отримати'
    required: true
    schema:
      type: string
responses:
  200:
    description: 'Успішна відповідь. Контакт знайдений.'
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            email:
              type: string
  404:
    description: 'Контакт не знайдений.'
